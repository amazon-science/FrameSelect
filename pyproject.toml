[build-system]
# setuptools 77 is the first release that accepts a PEP 639 SPDX
# ``license`` string together with ``license-files``; older releases
# reject this [project] table outright.
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "frameselect"
version = "0.1.0"
description = "FrameSelect: A Unified Library for Video Frame Selection and Evaluation"
readme = "README.md"
# SPDX expression (PEP 639). It supersedes the ``License ::`` trove
# classifier, which setuptools refuses to combine with it.
license = "CC-BY-NC-4.0"
license-files = ["LICENSE"]
# numpy<2 (below) has no wheels for Python 3.13 or newer.
requires-python = ">=3.9,<3.13"
authors = [
    {name = "Arihant Jain", email = "arihanta@amazon.com"},
    {name = "Chaosheng Dong", email = "ensteindcs@gmail.com"},
]
keywords = [
    "video", "frame-selection", "keyframe", "video-understanding",
    "multimodal", "VLM", "video-qa", "CLIP",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "torch>=2.0",
    # NumPy 2.x breaks many ML wheels that were built against the
    # NumPy 1.x ABI (``_ARRAY_API not found`` at torch import time
    # on macOS). Stay on 1.x until the wheel ecosystem catches up.
    "numpy>=1.22,<2",
    # Video decoder — upstream ``decord`` ships Linux / Windows wheels
    # only; on macOS we route to
    # ``eva-decord``, a maintained fork that keeps the same
    # ``from decord import VideoReader, cpu`` import path and
    # publishes wheels up to Python 3.11 for both Intel and Apple
    # Silicon.
    "decord>=0.6; sys_platform != 'darwin'",
    "eva-decord>=0.6.1; sys_platform == 'darwin'",
    "Pillow>=9.0",
    # 2.31 is the first open_clip release that ships the
    # ``ViT-SO400M-16-SigLIP2-384`` config (the paper's primary encoder).
    "open_clip_torch>=2.31",
    # The ``medr`` selector's pixel signals (HSV histograms, SSIM, DCT
    # perceptual hash, Farneback optical flow) run on OpenCV. OpenCV 4.12+
    # wheels require NumPy 2, so with the ``numpy<2`` pin above the resolver
    # settles on 4.11.x.
    "opencv-python-headless>=4.8",
    "scikit-learn>=1.2",
    # transformers 5.x requires torch>=2.4, and transformers 4.53+ calls
    # torch.compiler.is_compiling() (introduced in torch 2.3). Apple
    # Silicon + Linux have torch 2.4+ wheels so full support works, but
    # Intel macOS tops out at torch 2.2.2 — pin 4.49–4.52 there to stay
    # under both the torch>=2.4 and torch>=2.3 walls. Everywhere else we
    # stay on the latest 4.x so newer model architectures load. Tested with
    # 4.57.x (needed so newer Qwen VL checkpoints load).
    # The 4.49 floor is the first release with the Qwen2.5-VL classes that
    # the HF answering backend (``frameselect/vlm/hf.py``) loads for
    # ``vlm="hf:Qwen/Qwen2.5-VL-7B-Instruct"``.
    "transformers>=4.49,<4.53; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "transformers>=4.49,<5; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    # The HF answering backend always loads with ``device_map=``, which
    # transformers refuses without accelerate installed.
    "accelerate>=0.34",
    # anthropic 1.x drops ``temperature`` from ``messages.create``, which the
    # Anthropic answering backend sets to 0.
    "anthropic>=0.40,<1",
    "openai>=1.40",
    "tqdm>=4.65",
    "pandas>=2.0",
    # The M-CLIP text tower (``frameselect/encoders.py``) fetches from the
    # HuggingFace Hub.
    "huggingface_hub>=0.30",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.5"]
bedrock = ["boto3>=1.34"]
# Decoupled multilingual text tower (``text_encoder="mclip:<model>"``).
mclip = ["multilingual-clip"]
# ``s3://`` / ``gs://`` video URLs, read through fsspec (which
# ``huggingface_hub`` already installs). Without the floors pip
# resolves ``.[all]`` to s3fs 0.4.2 (2020): newer s3fs releases pin botocore
# through aiobotocore, which clashes with the newest boto3 that ``bedrock``
# pulls in, and pip backtracks s3fs instead of boto3. A recent pip
# resolves ``.[all]`` quickly; pip 24 can backtrack for a long time.
cloud = ["s3fs>=2023.1", "gcsfs>=2023.1"]
# Every runtime extra above (viz + bedrock + mclip + cloud).
all = [
    "matplotlib>=3.5",
    "boto3>=1.34",
    "multilingual-clip",
    "s3fs>=2023.1", "gcsfs>=2023.1",
]

[project.urls]
Homepage = "https://github.com/amazon-science/FrameSelect"
Documentation = "https://github.com/amazon-science/FrameSelect"
Repository = "https://github.com/amazon-science/FrameSelect"

[tool.setuptools.packages.find]
where = ["."]
include = ["frameselect*"]
